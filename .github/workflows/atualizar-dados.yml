name: Atualizar dados oficiais

on:
  schedule:
    - cron: "17 6 * * *"   # todo dia, 03:17 em Brasília (audiências mudam rápido)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: atualizar-dados
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Baixar e processar TSE, Câmara e Senado
        run: python scripts/atualizar_dados.py
      - name: Gravar os dados no repositório
        run: |
          git config user.name "cidadania-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Sem mudanças nos dados."
          else
            git commit -m "Atualiza dados oficiais ($(date -u +%Y-%m-%d))"
            git push
          fi
