</head><body>
<title>Cidadania</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..900&family=Public+Sans:ital,wght@0,400;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: coluna de app (máx. 760px) com cabeçalho fixo de cidade e barra de abas inferior; esferas de governo codificadas por cor (municipal verde, estadual azul, federal terra) */
:root{
  --paper:#EEF2EF; --surface:#FFFFFF; --sunk:#E3E9E5; --ink:#13211B; --muted:#56655E; --line:#CFD9D3;
  --accent:#0A6B4B; --accent-ink:#FFFFFF; --ipe:#E9A80B; --ipe-ink:#2A1E00;
  --mun:#0A6B4B; --est:#2457A6; --fed:#9A4214; --danger:#B3261E; --ok:#1C7C3A; --warn:#9A6400;
  --f-display:"Archivo","Arial Narrow",system-ui,sans-serif;
  --f-body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:10px; --nav-h:64px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0F1613; --surface:#17211C; --sunk:#1E2A24; --ink:#E6EEE9; --muted:#9AABA2; --line:#2D3B34;
  --accent:#3FBF8C; --accent-ink:#04140D; --ipe:#F2BC35; --ipe-ink:#2A1E00;
  --mun:#3FBF8C; --est:#7AA7F0; --fed:#E08A5A; --danger:#F08A82; --ok:#6FD08B; --warn:#E8B95A; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0F1613; --surface:#17211C; --sunk:#1E2A24; --ink:#E6EEE9; --muted:#9AABA2; --line:#2D3B34;
  --accent:#3FBF8C; --accent-ink:#04140D; --ipe:#F2BC35; --ipe-ink:#2A1E00;
  --mun:#3FBF8C; --est:#7AA7F0; --fed:#E08A5A; --danger:#F08A82; --ok:#6FD08B; --warn:#E8B95A; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--paper)}
body{color:var(--ink);font-family:var(--f-body);font-size:15.5px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
h1,h2,h3{font-family:var(--f-display);font-stretch:78%;line-height:1.08;margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:2rem;font-weight:850} h2{font-size:1.45rem;font-weight:800} h3{font-size:1.1rem;font-weight:750}
p{margin:0} a{color:var(--accent)}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.eyebrow{font-family:var(--f-display);font-stretch:100%;font-size:.72rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.mono{font-family:var(--f-mono);font-size:.85em;font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}

/* Header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;gap:12px;padding-block:10px}
.brand{font-family:var(--f-display);font-weight:900;font-stretch:72%;font-size:1.45rem;letter-spacing:-.01em;display:flex;align-items:center;gap:8px;color:var(--ink);text-decoration:none}
.brand-mark{width:26px;height:26px;border-radius:6px;background:var(--accent);position:relative;flex:none}
.brand-mark::after{content:"";position:absolute;left:6px;right:6px;bottom:6px;height:5px;background:var(--ipe);border-radius:1px}
.brand-mark::before{content:"";position:absolute;left:6px;top:6px;width:5px;height:9px;background:var(--accent-ink);border-radius:1px;box-shadow:8px -2px 0 var(--accent-ink)}
.city-btn{margin-left:auto;display:flex;align-items:center;gap:6px;background:var(--sunk);border:1px solid var(--line);color:var(--ink);border-radius:999px;padding:6px 12px;font:600 .88rem var(--f-body);cursor:pointer;max-width:60%;min-width:0}
.city-btn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

main{padding-bottom:calc(var(--nav-h) + 32px + env(safe-area-inset-bottom,0px))}
main .wrap{padding-block:20px}
.view{display:flex;flex-direction:column;gap:20px}

/* Bottom nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .wrap{display:grid;grid-template-columns:repeat(6,1fr);height:var(--nav-h)}
nav.tabs a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;text-decoration:none;color:var(--muted);font-size:.68rem;font-weight:600;border-top:3px solid transparent;margin-top:-1px}
nav.tabs a svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs a[aria-current="page"]{color:var(--accent);border-top-color:var(--accent)}
nav.tabs a.report{color:var(--ink)}
nav.tabs a.report .plus{width:34px;height:34px;border-radius:10px;background:var(--ipe);color:var(--ipe-ink);display:grid;place-items:center;margin-top:-4px}
nav.tabs a.report .plus svg{width:20px;height:20px;stroke-width:2.4}

/* Surfaces */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.card.flat{background:transparent;border-style:dashed}
.section-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.list > *{padding:14px 16px;border-top:1px solid var(--line)}
.list > *:first-child{border-top:0}
.item-btn{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:none;border:0;color:inherit;font:inherit;cursor:pointer}
.item-btn:hover{background:var(--sunk)}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:8px;padding:10px 16px;font:700 .92rem var(--f-body);border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;text-decoration:none;min-height:42px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ipe{background:var(--ipe);border-color:var(--ipe);color:var(--ipe-ink)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--accent);padding-inline:8px}
.btn.small{min-height:34px;padding:6px 12px;font-size:.84rem}
.btn.block{width:100%}
.btn[disabled]{opacity:.5;cursor:not-allowed}
:focus-visible{outline:3px solid var(--ipe);outline-offset:2px}

/* Forms */
label.f{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:.9rem}
label.f small{font-weight:400;color:var(--muted)}
input[type=text],input[type=email],input[type=tel],input[type=search],select,textarea{width:100%;font:400 1rem var(--f-body);color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;min-height:44px}
textarea{min-height:110px;resize:vertical;line-height:1.45}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:0;border-color:var(--accent)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:520px){.grid2{grid-template-columns:1fr}}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;background:var(--sunk);padding:4px;border-radius:10px}
.seg button{border:0;background:transparent;border-radius:7px;padding:9px 6px;font:600 .85rem var(--f-body);color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}

/* Esfera chips */
.esf{display:inline-flex;align-items:center;gap:6px;font:700 .7rem var(--f-display);font-stretch:100%;letter-spacing:.08em;text-transform:uppercase;padding:3px 8px 3px 6px;border-radius:4px;border:1px solid currentColor;white-space:nowrap}
.esf::before{content:attr(data-l);display:grid;place-items:center;width:15px;height:15px;border-radius:3px;background:currentColor;font-size:.64rem;letter-spacing:0}
.esf.municipal{color:var(--mun)} .esf.estadual{color:var(--est)} .esf.federal{color:var(--fed)} .esf.local{color:var(--mun)} .esf.regional{color:var(--est)} .esf.nacional{color:var(--fed)}
.esf::before{color:var(--surface)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:.76rem;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--sunk);color:var(--ink);white-space:nowrap}
.pill i{width:7px;height:7px;border-radius:50%;background:currentColor;display:inline-block}
.pill.s-enviada{color:var(--est)} .pill.s-respondida{color:var(--warn)} .pill.s-resolvida{color:var(--ok)} .pill.s-vencida{color:var(--danger)} .pill.s-rascunho{color:var(--muted)}
.pill.demo{background:var(--ipe);color:var(--ipe-ink)}

/* Home hero */
.hero{background:var(--accent);color:var(--accent-ink);border-radius:14px;padding:22px 20px;display:grid;gap:14px;position:relative;overflow:hidden}
.hero h1{font-size:2.15rem;max-width:16ch}
.hero p{max-width:46ch;opacity:.92}
.hero .stripe{position:absolute;right:-30px;top:18px;width:160px;height:14px;background:var(--ipe);transform:rotate(-8deg);opacity:.95}
.hero .btn{background:var(--ipe);border-color:var(--ipe);color:var(--ipe-ink);justify-self:start}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media (max-width:560px){.quick{grid-template-columns:repeat(2,1fr)}}
.quick button{display:flex;flex-direction:column;align-items:flex-start;gap:8px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;font:600 .88rem var(--f-body);color:var(--ink);cursor:pointer;min-height:92px}
.quick button:hover{border-color:var(--accent)}
.quick .ico{width:30px;height:30px;border-radius:7px;display:grid;place-items:center;background:var(--sunk);color:var(--accent)}
.quick .ico svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* Steps (relatar) */
.stepper{display:flex;gap:6px}
.stepper span{flex:1;height:5px;border-radius:3px;background:var(--line)}
.stepper span.on{background:var(--accent)}
.media-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.media-grid .m{position:relative;aspect-ratio:1;border-radius:8px;overflow:hidden;background:var(--sunk);border:1px solid var(--line);max-width:100%}
.media-grid .m img,.media-grid .m video{width:100%;height:100%;object-fit:cover;display:block}
.media-grid .m button{position:absolute;top:4px;right:4px;width:26px;height:26px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;cursor:pointer;font-size:14px;line-height:1}
.media-grid .m .tag{position:absolute;left:4px;bottom:4px;font:600 .66rem var(--f-body);background:rgba(0,0,0,.6);color:#fff;padding:1px 6px;border-radius:3px}
.drop{display:grid;place-items:center;gap:6px;text-align:center;padding:22px 12px;border:1.5px dashed var(--line);border-radius:var(--r);background:var(--surface);cursor:pointer}
.drop:hover{border-color:var(--accent)}
.cat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}
.cat-grid button{display:flex;flex-direction:column;gap:6px;align-items:flex-start;text-align:left;padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:600 .86rem var(--f-body);cursor:pointer}
.cat-grid button[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);background:var(--sunk)}
.why{border-left:4px solid var(--ipe);background:var(--sunk);padding:12px 14px;border-radius:0 8px 8px 0;font-size:.93rem}
.why b{font-family:var(--f-display);font-stretch:85%;letter-spacing:.01em}
.mail{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.mail .mh{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;padding:12px 14px;border-bottom:1px solid var(--line);font-size:.88rem}
.mail .mh dt{color:var(--muted);font-weight:600}
.mail .mh dd{margin:0;min-width:0;overflow-wrap:anywhere}
.mail pre{margin:0;padding:14px;white-space:pre-wrap;font:400 .92rem/1.55 var(--f-body);max-height:360px;overflow:auto}

/* People */
.person{display:flex;gap:12px;align-items:center}
.avatar{width:42px;height:42px;border-radius:50%;flex:none;display:grid;place-items:center;font:800 .9rem var(--f-display);font-stretch:85%;color:var(--surface)}
.office-group{display:flex;flex-direction:column;gap:10px}
.office-group h3{display:flex;align-items:center;gap:10px}
.stat-row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media (max-width:480px){.stat-row{grid-template-columns:repeat(2,1fr)}}
.stat{background:var(--sunk);border-radius:8px;padding:10px}
.stat b{display:block;font:850 1.5rem var(--f-display);font-stretch:80%;font-variant-numeric:tabular-nums}
.stat span{font-size:.76rem;color:var(--muted);font-weight:600}
.vote{display:inline-block;min-width:52px;text-align:center;font:700 .74rem var(--f-display);font-stretch:100%;letter-spacing:.06em;padding:3px 6px;border-radius:4px}
.vote.sim{background:var(--ok);color:var(--surface)} .vote.nao{background:var(--danger);color:var(--surface)} .vote.abst{background:var(--line);color:var(--ink)} .vote.aus{border:1px dashed var(--muted);color:var(--muted)}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th,td{text-align:left;padding:10px 12px;border-top:1px solid var(--line);vertical-align:top}
th{font:700 .72rem var(--f-display);font-stretch:100%;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);border-top:0;background:var(--sunk)}

/* Proposals */
.prop{display:grid;grid-template-columns:64px 1fr;gap:14px;align-items:start}
.support{display:flex;flex-direction:column;align-items:center;gap:2px;border:1px solid var(--line);border-radius:8px;padding:8px 4px;background:var(--surface);color:var(--ink);cursor:pointer;font:inherit}
.support b{font:850 1.3rem var(--f-display);font-stretch:80%;font-variant-numeric:tabular-nums}
.support small{font-size:.66rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.support[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.support[aria-pressed="true"] small{color:var(--accent-ink)}
.meter{height:8px;border-radius:4px;background:var(--sunk);overflow:hidden}
.meter i{display:block;height:100%;background:var(--ipe)}

/* Learn */
.lesson{display:grid;grid-template-columns:44px 1fr;gap:14px;align-items:start}
.lesson .n{font:900 1.9rem var(--f-display);font-stretch:70%;color:var(--accent);line-height:1}
.powers{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media (max-width:520px){.powers{grid-template-columns:1fr}}
.powers div{background:var(--sunk);border-radius:8px;padding:12px;font-size:.9rem}
.powers b{display:block;font-family:var(--f-display);font-stretch:85%;font-size:1rem;margin-bottom:4px}
.flow{display:flex;flex-direction:column;gap:0}
.flow li{list-style:none;display:grid;grid-template-columns:28px 1fr;gap:10px;padding-bottom:12px;position:relative}
.flow li::before{content:counter(f);counter-increment:f;width:28px;height:28px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font:800 .8rem var(--f-display)}
.flow li:not(:last-child)::after{content:"";position:absolute;left:13px;top:30px;bottom:2px;width:2px;background:var(--line)}
.flow{counter-reset:f;padding:0;margin:0}
details.acc{border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
details.acc summary{cursor:pointer;padding:14px 16px;font-weight:700;list-style:none;display:flex;gap:12px;align-items:center}
details.acc summary::-webkit-details-marker{display:none}
details.acc summary::after{content:"+";margin-left:auto;font:700 1.2rem var(--f-display);color:var(--muted)}
details.acc[open] summary::after{content:"–"}
details.acc .body{padding:0 16px 16px;display:flex;flex-direction:column;gap:10px}
.quiz-opt{display:block;width:100%;text-align:left;padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;cursor:pointer;margin-top:6px}
.quiz-opt.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,var(--surface))}
.quiz-opt.wrong{border-color:var(--danger);background:color-mix(in srgb,var(--danger) 12%,var(--surface))}

/* Sheet / overlays */
.sheet-bg{position:fixed;inset:0;background:rgba(5,12,9,.55);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--paper);width:100%;max-width:760px;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:18px max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:16px}
@media (min-width:800px){.sheet-bg{align-items:center}.sheet{border-radius:16px;max-height:86vh}}
.sheet-head{display:flex;align-items:flex-start;gap:12px}
.sheet-head .x{margin-left:auto;flex:none;width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;font-size:18px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + 16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:8px;font-weight:600;font-size:.9rem;z-index:60;max-width:calc(100% - 32px)}

/* Onboarding / login */
.gate{min-height:100%;display:flex;flex-direction:column}
.gate .wrap{padding-block:28px;display:flex;flex-direction:column;gap:22px;max-width:520px}
.divider{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:.82rem}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--line)}
.tut-card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px;display:flex;flex-direction:column;gap:14px;min-height:300px}
.tut-art{height:120px;border-radius:10px;background:var(--sunk);display:grid;place-items:center;overflow:hidden}
.dots{display:flex;gap:6px;justify-content:center}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--accent);width:22px;border-radius:4px}
.notice{display:flex;gap:10px;align-items:flex-start;font-size:.86rem;background:color-mix(in srgb,var(--ipe) 22%,var(--surface));border:1px solid color-mix(in srgb,var(--ipe) 60%,var(--line));border-radius:8px;padding:10px 12px}
.notice b{white-space:nowrap}
.empty{text-align:center;padding:26px 16px;display:grid;gap:10px;justify-items:center}

function hash(s){let h=2166136261;for(const c of s){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0}
function rng(seed){let x=seed||1;return()=>{x^=x<<13;x^=x>>>17;x^=x<<5;return((x>>>0)%10000)/10000}}

function classify(text){
  const t=" "+norm(text)+" "; let best=null,score=0;

  return best;
}

    else lsSet("cid.rec",S.reclamacoes);
  },
  async delRec(id){S.reclamacoes=S.reclamacoes.filter(x=>x.id!==id);if(this.db){try{await this.db.doc(this.priv()+"/"+id).delete()}catch(e){}}else lsSet("cid.rec",S.reclamacoes)},
  async put(col,key,id,data){
    const arr=S[key]; const i=arr.findIndex(x=>x.id===id); const doc={id,...data}; if(i>=0)arr[i]=doc; else arr.push(doc);
    if(this.db){try{await this.db.doc(col+"/"+id).set(data)}catch(e){toast("Não foi possível publicar: "+(e.message||e.code));}}
    else{lsSet(CACHEKEY[key],arr);if(Nostr.ready)await Nostr.publish(col,id,data)}
  },

  async putDir(id,data){S.diretorio[id]={id,...data};if(this.db){try{await this.db.doc("diretorio/"+id).set(data)}catch(e){}}else{lsSet("cid.dir",S.diretorio);if(Nostr.ready)await Nostr.publish("diretorio",id,data)}}
};

/* ---------- mídia ---------- */
async function shrinkImage(file,max=1280,q=.78){
  const url=URL.createObjectURL(file); const img=new Image(); img.src=url; await img.decode();
  const s=Math.min(1,max/Math.max(img.width,img.height)); const c=document.createElement("canvas");
  c.width=Math.round(img.width*s); c.height=Math.round(img.height*s); c.getContext("2d").drawImage(img,0,0,c.width,c.height);
  URL.revokeObjectURL(url);
  return await new Promise(r=>c.toBlob(b=>r(b),"image/jpeg",q));
}
function blobToDataURL(b){return new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result);f.readAsDataURL(b)})}
async function storeMedia(file){
  const isVideo=file.type.startsWith("video/");
  if(S.assets){
    try{const blob=isVideo?file:await shrinkImage(file);const up=await S.assets.upload(blob);return {tipo:isVideo?"video":"foto",url:up.url,assetId:up.id,nome:file.name}}catch(e){}
  }
  if(isVideo){return {tipo:"video",url:URL.createObjectURL(file),nome:file.name,temporario:true}}
  const small=await shrinkImage(file,640,.62); return {tipo:"foto",url:await blobToDataURL(small),nome:file.name};
}

function corpoEmail(r,modelo,ident){
  const cat=CAT[r.cat]||{org:"órgão responsável",n:"Outro"}; const p=S.perfil||{}; const L=[];
  L.push(`Prezados(as) da ${cat.org},`,"");

  if(modelo==="lai"){
    L.push(`${quem} com base na Lei de Acesso à Informação (Lei 12.527/2011), solicito as seguintes informações sobre o problema descrito abaixo, em ${cidadeNome()}:`,"");
    L.push("1. Se o problema já foi registrado pelo órgão e qual o número do registro;","2. Qual o prazo previsto para a solução e qual a equipe responsável;","3. Qual o orçamento previsto e executado para este tipo de serviço no ano corrente.","");
    L.push(`Descrição: ${r.texto}`); if(r.local)L.push(`Local: ${r.local}`);
    L.push("","Lembro que o prazo legal de resposta é de 20 dias, prorrogável por mais 10 mediante justificativa (art. 11).");
  } else {
    const verbo={reclamacao:"venho registrar a seguinte reclamação",providencia:"venho solicitar providências para o problema abaixo",denuncia:"venho denunciar a situação abaixo"}[modelo];
    L.push(`${quem} ${verbo}, referente a ${cat.n.toLowerCase()} em ${cidadeNome()}.`,"");
    L.push(`Problema: ${r.titulo}`); L.push(`Descrição: ${r.texto}`); const loc=[r.rua,r.local,r.bairro].filter(Boolean).join(", "); if(loc)L.push(`Local: ${loc}`);
    if(r.midia?.length)L.push(`Registros: ${r.midia.length} ${r.midia.length>1?"arquivos":"arquivo"} de foto/vídeo ${r.midia.some(m=>m.url&&!m.url.startsWith("data:")&&!m.temporario)?"disponíveis nos links abaixo":"que posso enviar em anexo"}.`);
    L.push("","Peço que me informem o número de protocolo, as providências que serão tomadas e o prazo previsto. Conforme a Lei 13.460/2017 (Código de Defesa do Usuário do Serviço Público), a resposta deve ser dada em até 30 dias, prorrogáveis uma vez por igual período.");
  }
  L.push("","Atenciosamente,");
  if(ident==="anonimo")L.push("Cidadã(o) — envio anônimo pelo app Cidadania");
  else{L.push(p.nome||"[seu nome]");if(ident==="completo"){if(p.cpf)L.push("CPF: "+p.cpf);if(p.cidadeVoto)L.push("Cidade de votação: "+p.cidadeVoto);if(p.telefone)L.push("Telefone: "+p.telefone)}if(p.email)L.push(p.email)}
  L.push(`Protocolo no app Cidadania: ${protocolo(r)}`);
  const links=(r.midia||[]).filter(m=>m.url&&!m.url.startsWith("data:")&&!m.temporario).map(m=>m.url);
  if(links.length){L.push("","Links das fotos e vídeos:",...links)}
  return L.join("\n");
}

function statusOf(r){

  if(!r.enviadoEm)return {k:"rascunho",n:"Rascunho"};
  const prazo=r.modelo==="lai"?20:30; const d=daysSince(r.enviadoEm);
  if(d>prazo)return {k:"vencida",n:`Prazo vencido há ${d-prazo} d`};

}

    <label class="drop" for="mFile"><svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="3" y="6" width="18" height="14" rx="2"/><circle cx="12" cy="13" r="3.5"/><path d="M8 6l1.5-2h5L16 6"/></svg><b>Tirar foto, gravar vídeo ou escolher arquivo</b><span class="muted" style="font-size:.85rem">No celular, abre a câmera. Fotos são reduzidas para envio rápido.</span></label>
    <input type="file" id="mFile" accept="image/*,video/*" multiple hidden>
    ${d.midia.length?`<div class="media-grid">${d.midia.map((m,i)=>`<div class="m">${m.tipo==="foto"?`<img src="${esc(m.url)}" alt="Foto ${i+1}">`:`<video src="${esc(m.url)}" muted playsinline preload="metadata"></video><span class="tag">vídeo</span>`}<button data-rm="${i}" aria-label="Remover">×</button></div>`).join("")}</div>`:""}
    <p class="muted" id="upMsg" role="status" style="font-size:.85rem">${d.midia.some(m=>m.temporario)?"Vídeos ficam só neste aparelho no protótipo; anexe-os ao e-mail manualmente.":""}</p>
    <div class="row"><button class="btn primary grow" id="nx">${d.midia.length?"Continuar":"Continuar sem mídia"}</button></div>`;
  if(d.passo===2)return head+`<h1>Descreva</h1>
    <form id="fDesc" class="stack">
      <label class="f">Título curto<input type="text" id="dTit" maxlength="90" value="${esc(d.titulo)}" placeholder="Ex.: Buraco grande na Rua São José, em frente ao nº 120"></label>
      <label class="f">O que acontece? <small>Desde quando, quem é afetado, se já houve acidente ou reclamação anterior.</small><textarea id="dTxt">${esc(d.texto)}</textarea></label>
      <div class="grid2"><label class="f">Bairro <small>Organiza o mural por região.</small><input type="text" id="dBai" list="bairrosList" value="${esc(d.bairro)}" autocomplete="off"></label>
      <label class="f">Rua ou logradouro<input type="text" id="dRua" list="ruasList" value="${esc(d.rua)}" autocomplete="off"></label></div>
      <datalist id="bairrosList">${bairrosDaCidade().map(b=>`<option value="${esc(b)}">`).join("")}</datalist>
      <datalist id="ruasList">${ruasDoBairro(d.bairro).map(b=>`<option value="${esc(b)}">`).join("")}</datalist>
      <label class="f">Número ou ponto de referência<input type="text" id="dLoc" value="${esc(d.local)}" placeholder="Ex.: em frente ao nº 120, perto da padaria"></label>
      <p class="muted" id="dErr" role="alert" hidden></p>
      <div class="row"><button type="button" class="btn" id="bk">Voltar</button><button class="btn primary grow" type="submit">Continuar</button></div>
    </form>`;
  if(d.passo===3){
    const cat=CAT[d.cat];
    return head+`<h1>Quem resolve?</h1>
    ${cat?`<div class="card stack"><div class="row"><span class="esf ${cat.e}" data-l="${ESF[cat.e].l}">${ESF[cat.e].n}</span>${d.catAuto?'<span class="pill">Sugestão automática</span>':""}</div>
      <h2>${esc(cat.org)}</h2><p class="muted">${esc(cat.n)}</p>
      <div class="why"><b>Por que é com ${cat.e==="municipal"?"a prefeitura":cat.e==="estadual"?"o estado":"a União"}?</b> ${esc(cat.why)}</div>
      <h3 style="margin-top:6px">Quem pode agir</h3><div class="list">${responsaveis(cat,S.cidade).map(x=>personRow(x.p,x.papel)).join("")}</div>
      <p class="muted" style="font-size:.82rem">${Dados.disp?"Eleitos: TSE, Câmara e Senado. Secretários: informados e conferidos por moradores.":'<span class="pill demo">Demonstração</span> Nomes e partidos são fictícios neste modo.'}</p>
    </div>`:`<div class="card flat"><p>Não deu para identificar o tipo automaticamente. Escolha abaixo.</p></div>`}
    ${S.sample?`<button class="btn" id="aiCat"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 3l2 5 5 2-5 2-2 5-2-5-5-2 5-2z"/></svg>Pedir ao Claude para analisar o relato</button><p class="muted" id="aiMsg" role="status" style="font-size:.86rem"></p>`:""}
    <details class="acc" ${cat?"":"open"}><summary>Escolher outro tipo de problema</summary><div class="body"><div class="cat-grid">${CATS.map(c=>`<button data-cat="${c.k}" aria-pressed="${c.k===d.cat}"><span class="esf ${c.e}" data-l="${ESF[c.e].l}">${ESF[c.e].n}</span>${esc(c.n)}</button>`).join("")}</div></div></details>
    <div class="row"><button class="btn" id="bk">Voltar</button><button class="btn primary grow" id="nx" ${cat?"":"disabled"}>Preparar cobrança</button></div>`;
  }
  const cat=CAT[d.cat]; const ch=CHANNEL[cat.e]; const ve=valorDe(alvoEmail(cat)); const sug=ve.ver?ve.ver.c.valor:"";
  if(!d.para&&sug)d.para=sug; if(d.compartilhar===undefined)d.compartilhar=true;
  const canal=cat.e==="municipal"?canalCidade():null; if(!d.via)d.via=canal&&!sug?"central":"email";
  const novoEmail=d.para&&emailOk(d.para)&&d.para.toLowerCase()!==sug&&!ve.todos.some(x=>x.c.valor===d.para.toLowerCase());
  const corpo=corpoEmail(d,d.modelo,d.ident); const assunto=MODELOS[d.modelo].assunto(d);
  return head+`<h1>Enviar cobrança</h1>
    <div class="stack"><span class="eyebrow">Tipo de mensagem</span><div class="seg" role="group">${Object.entries(MODELOS).map(([k,m])=>`<button data-mod="${k}" aria-pressed="${d.modelo===k}">${m.n}</button>`).join("")}</div></div>
    <div class="stack"><span class="eyebrow">Identificação</span><div class="seg" role="group">${[["completo","Completa"],["nome","Só nome"],["anonimo","Anônimo"]].map(([k,n])=>`<button data-id="${k}" aria-pressed="${d.ident===k}">${n}</button>`).join("")}</div>
    <p class="muted" style="font-size:.85rem">${d.ident==="completo"?"Inclui nome, CPF, cidade de votação e contato. Pedidos identificados têm mais chance de resposta e você recebe o retorno.":d.ident==="nome"?"Inclui só seu nome e e-mail.":"Sem dados pessoais. Para anonimato real, envie de um e-mail que não leve seu nome. Pedidos pela Lei de Acesso à Informação exigem identificação."}${d.ident==="completo"&&!S.perfil.cpf?' <a href="#perfil">Complete CPF e cidade de votação no perfil.</a>':""}</p></div>
    ${cat.e==="municipal"?`<div class="stack"><span class="eyebrow">Como enviar</span><div class="seg" role="group">${[["email","Por e-mail"],["central","Central da cidade"]].map(([k,n])=>`<button data-via="${k}" aria-pressed="${d.via===k}">${n}</button>`).join("")}</div></div>`:""}
    ${d.via==="central"?(canal?`<div class="card stack" style="gap:8px"><span class="eyebrow">Canal oficial de ${esc(S.cidade.nome)}</span><h3>${esc(canal.nome)}</h3>${canal.nota?`<p class="muted" style="font-size:.9rem">${esc(canal.nota)}</p>`:""}
      <div class="row">${canal.url?`<a class="btn small primary" href="${esc(canal.url)}" target="_blank" rel="noopener">Abrir ${esc(canal.nome)}</a>`:""}${canal.telefone?`<span class="mono">Telefone: ${esc(canal.telefone)}</span>`:""}</div>
      <ol class="flow" style="font-size:.9rem"><li><div>Toque em <b>Copiar texto</b>, abaixo.</div></li><li><div>Abra a central e escolha o tipo de pedido (reclamação, solicitação de serviço ou denúncia).</div></li><li><div>Cole o texto, anexe as fotos e envie.</div></li><li><div>Anote aqui o número de protocolo que a central mostrar.</div></li></ol>
      <p class="muted" style="font-size:.8rem">${canal.origem==="oficial"?"Canal confirmado em documento oficial":`Canal informado por moradores e conferido por ${canal.conf} ${canal.conf===1?"pessoa":"pessoas"}`}${canal.fonte?` · <a href="${esc(canal.fonte)}" target="_blank" rel="noopener noreferrer">fonte</a>`:""}</p></div>`
      :`<div class="card flat stack"><p><b>Ainda não sabemos a central de atendimento de ${esc(S.cidade.nome)}.</b></p><p class="muted" style="font-size:.9rem">Muitas cidades têm telefone 156, site ou aplicativo próprio. Se você souber, informe com a fonte para outros moradores.</p><button class="btn small" id="infCanal" type="button" style="align-self:flex-start">Informar a central da cidade</button></div>`)
      +`<label class="f">Protocolo dado pelo órgão <small>Opcional. Pode anotar depois, na cobrança.</small><input type="text" id="protoOrg" value="${esc(d.protoOrg||"")}" placeholder="Ex.: RIO-12345678-9"></label>`:`
    <label class="f">Para <small>${esc(ch.nome)}. ${esc(ch.nota)} ${ve.ver?`Endereço conferido por ${ve.ver.a.nconf} ${ve.ver.a.nconf===1?"pessoa":"pessoas"}${emailOficial(sug)?"":", fora de domínio oficial"}.`:ve.pend.length?`Há ${ve.pend.length} ${ve.pend.length>1?"sugestões":"sugestão"} aguardando conferência: ${ve.pend.slice(0,2).map(x=>esc(x.c.valor)).join(", ")}. Confira no site oficial antes de usar.`:"Ninguém informou ainda o e-mail deste órgão em "+esc(S.cidade.nome)+". Cole o endereço do site oficial."}</small><input type="email" id="para" value="${esc(d.para)}" placeholder="ouvidoria@…gov.br"></label>
    ${novoEmail?`<label class="row" style="gap:10px;font-size:.9rem"><input type="checkbox" id="shareMail" ${d.compartilhar?"checked":""} style="width:20px;height:20px"> Sugerir este e-mail para outros moradores <span class="muted">(passa por conferência)</span></label>`:""}
    <div class="row">${ch.url?`<a class="btn small" href="${ch.url}" target="_blank" rel="noopener">Abrir o Fala.BR</a>`:""}<button class="btn small ghost" id="mailHist" type="button">E-mails sugeridos e conferências</button></div>
    `}
    <div class="mail"><dl class="mh"><dt>Para</dt><dd>${esc(d.via==="central"?(canal?canal.nome:"Central da cidade"):(d.para||"—"))}</dd><dt>Assunto</dt><dd id="mAss">${esc(assunto)}</dd></dl><pre id="mBody">${esc(corpo)}</pre></div>
    <div class="row"><button class="btn" id="cpy">Copiar texto</button>${d.via==="central"?"":`<a class="btn" id="mailto" href="mailto:${encodeURIComponent(d.para)}?subject=${encodeURIComponent(assunto)}&body=${encodeURIComponent(corpo.slice(0,1800))}">Abrir no app de e-mail</a>`}</div>
    <label class="row" style="gap:10px;font-weight:600"><input type="checkbox" id="pub" ${d.publico?"checked":""} style="width:20px;height:20px"> Mostrar no mural de ${esc(S.cidade.nome)} <span class="muted" style="font-weight:400;font-size:.85rem">(sem seu nome)</span></label>
    <div class="row"><button class="btn" id="bk">Voltar</button><button class="btn primary grow" id="fin">Registrar como enviada</button></div>
    <p class="muted" style="font-size:.84rem">Envie pelo seu e-mail ou pelo canal oficial e depois toque em “Registrar como enviada”. A contagem do prazo começa aí.</p>`;
}
const PEOPLE={};
function registerPeople(list){for(const p of list)PEOPLE[p.id]=p}
function bindPeople(root=document){root.querySelectorAll("[data-pid]").forEach(b=>b.onclick=()=>openPerson(PEOPLE[b.dataset.pid]))}
function bindRelatar(){
  const d=S.draft; const bk=$("#bk"); if(bk)bk.onclick=()=>{d.passo--;render()};
  if(d.passo===1){
    $("#mFile").onchange=async e=>{const files=[...e.target.files];$("#upMsg").textContent="Processando "+files.length+" arquivo(s)…";
      for(const f of files){if(f.size>200*1024*1024){toast(f.name+" passa de 200 MB");continue}try{d.midia.push(await storeMedia(f))}catch(err){toast("Não foi possível ler "+f.name)}}render()};
    document.querySelectorAll("[data-rm]").forEach(b=>b.onclick=()=>{d.midia.splice(+b.dataset.rm,1);render()});
    $("#nx").onclick=()=>{d.passo=2;render()};
  }
  if(d.passo===2){
    $("#fDesc").onsubmit=e=>{e.preventDefault();d.titulo=$("#dTit").value.trim();d.texto=$("#dTxt").value.trim();d.local=$("#dLoc").value.trim();d.bairro=limpaRegiao($("#dBai").value);d.rua=limpaRegiao($("#dRua").value);
      if(!d.titulo||d.texto.length<15){const er=$("#dErr");er.hidden=false;er.textContent="Dê um título e descreva o problema em pelo menos uma frase completa.";return}
      if(d.catAuto||!d.cat){d.cat=classify(d.titulo+" "+d.texto+" "+d.local);d.catAuto=true}
      d.passo=3;render()};
    ["dTit","dTxt","dLoc","dBai","dRua"].forEach(id=>$("#"+id).oninput=e=>{d[{dTit:"titulo",dTxt:"texto",dLoc:"local",dBai:"bairro",dRua:"rua"}[id]]=e.target.value});
  }
  if(d.passo===3){
    if(d.cat){registerPeople(responsaveis(CAT[d.cat],S.cidade).map(x=>x.p));bindPeople()}
    document.querySelectorAll("[data-cat]").forEach(b=>b.onclick=()=>{d.cat=b.dataset.cat;d.catAuto=false;render()});
    $("#nx").onclick=()=>{d.passo=4;render()};
    const ai=$("#aiCat"); if(ai)ai.onclick=async()=>{ai.disabled=true;const msg=$("#aiMsg");msg.textContent="Analisando…";
      try{const res=await S.sample.json(`Você classifica problemas urbanos relatados por cidadãos brasileiros. Categorias possíveis (chave: nome — esfera):\n${CATS.map(c=>`${c.k}: ${c.n} — ${c.e}`).join("\n")}\n\nRelato:\nTítulo: ${d.titulo}\nTexto: ${d.texto}\nLocal: ${d.local}\nCidade: ${cidadeNome()}\n\nResponda só com JSON {"cat":"<chave>","motivo":"<uma frase em português explicando a escolha e qualquer ressalva, por exemplo se a unidade pode ser de outra esfera>"}.`,{modelTier:"quick"});
        if(res&&CAT[res.cat]){d.cat=res.cat;d.catAuto=true;render();const m=$("#aiMsg");if(m)m.textContent="Claude: "+(res.motivo||"")}else{msg.textContent="Não houve uma resposta clara. Escolha o tipo manualmente."}}
      catch(e){msg.textContent=e.code==="not_granted"?"Análise não autorizada nesta página.":"Análise indisponível agora. Escolha o tipo manualmente.";ai.disabled=false}};
  }
  if(d.passo===4){
    document.querySelectorAll("[data-mod]").forEach(b=>b.onclick=()=>{d.modelo=b.dataset.mod;if(d.modelo==="lai"&&d.ident==="anonimo")d.ident="nome";render()});
    document.querySelectorAll("[data-id]").forEach(b=>b.onclick=()=>{d.ident=b.dataset.id;if(d.ident==="anonimo"&&d.modelo==="lai"){d.modelo="reclamacao";toast("Pedido pela LAI exige identificação; mudei para Reclamação")}render()});
    const pa=$("#para");if(pa){pa.oninput=e=>{d.para=e.target.value.trim()};pa.onchange=()=>render()}
    const mh=$("#mailHist");if(!mh){} 
    $("#pub").onchange=e=>{d.publico=e.target.checked};
    const sm=$("#shareMail");if(sm)sm.onchange=e=>{d.compartilhar=e.target.checked};
    document.querySelectorAll("[data-via]").forEach(b=>b.onclick=()=>{d.via=b.dataset.via;render()});
    const po=$("#protoOrg");if(po)po.oninput=e=>{d.protoOrg=e.target.value.trim()};
    const ic=$("#infCanal");if(ic)ic.onclick=()=>openContrib({alvo:alvoCanal(S.cidade),campo:"canal",rotulo:`Central de atendimento — ${S.cidade.nome}`});
    const mh2=$("#mailHist");if(mh2)mh2.onclick=()=>{const cat=CAT[d.cat];openAlvo(alvoEmail(cat),`E-mail: ${cat.org} — ${S.cidade.nome}`,"email")};
    $("#cpy").onclick=()=>copyText(`Assunto: ${$("#mAss").textContent}\n\n${$("#mBody").textContent}`,$("#mBody"));
    $("#fin").onclick=async()=>{
      const cat=CAT[d.cat]; const r={id:d.id,titulo:d.titulo,texto:d.texto,local:d.local,bairro:d.bairro||"",rua:d.rua||"",cat:d.cat,modelo:d.modelo,ident:d.ident,via:d.via||"email",para:d.via==="central"?((canalCidade()||{}).nome||"Central da cidade"):d.para,protoOrg:d.via==="central"?(d.protoOrg||""):"",
        midia:d.midia.filter(m=>!m.temporario).map(m=>({tipo:m.tipo,url:m.url,assetId:m.assetId||null,nome:m.nome})),
        cidade:S.cidade.nome,uf:S.cidade.uf||"",pais:S.cidade.pais||"Brasil",criado:Date.now(),enviadoEm:Date.now(),respostas:[],status:"enviada",
        assunto:MODELOS[d.modelo].assunto(d),corpo:corpoEmail(d,d.modelo,d.ident)};
      await Store.saveRec(r);
      const ve=valorDe(alvoEmail(cat)); const em=(d.para||"").toLowerCase();
      if(d.via!=="central"&&d.compartilhar!==false&&emailOk(em)&&!ve.todos.some(x=>x.c.valor===em)){const meusHoje=S.contribs.filter(x=>autorDe(x)===S.uid&&Date.now()-x.criado<864e5).length;
        if(meusHoje<LIMITE_DIA)await Store.put("contrib","contribs","c_"+Date.now().toString(36)+uidLocal(),{alvo:alvoEmail(cat),campo:"email",valor:em,fonte:"",obs:"Usado numa cobrança",rotulo:`E-mail: ${cat.org} — ${S.cidade.nome}`,cidade:S.cidade.nome,uf:S.cidade.uf||"",autor:S.uid,criado:Date.now()})}
      if(d.publico){const f=r.midia.find(m=>m.tipo==="foto");let foto="";if(f){foto=f.url.startsWith("data:")?await thumb(f.url):f.url}
        await Store.put("mural","mural","m_"+r.id,{titulo:r.titulo,resumo:r.texto.slice(0,220),local:r.local,bairro:r.bairro,rua:r.rua,cat:r.cat,cidade:r.cidade,uf:r.uf,pais:r.pais,foto,criado:r.criado,status:"aberto"})}
      S.draft=null; toast("Cobrança registrada: "+protocolo(r)); location.hash="perfil";
    };
  }
}

/* ---------- detalhe da reclamação ---------- */
function openRec(id){
  const r=S.reclamacoes.find(x=>x.id===id); if(!r)return; const cat=CAT[r.cat]; const st=statusOf(r);
  openSheet(r.titulo,`
    <div class="row"><span class="pill s-${st.k}"><i></i>${st.n}</span>${cat?`<span class="esf ${cat.e}" data-l="${ESF[cat.e].l}">${ESF[cat.e].n}</span>`:""}<span class="muted mono">${protocolo(r)}</span></div>
    ${r.midia?.length?`<div class="thumbs">${r.midia.map(m=>m.tipo==="foto"?`<img src="${esc(m.url)}" alt="">`:`<video src="${esc(m.url)}" controls style="height:64px;border-radius:6px"></video>`).join("")}</div>`:""}
    <p>${esc(r.texto)}</p>${r.local?`<p class="muted">Local: ${esc(r.local)}</p>`:""}
    <div class="timeline">
      <div class="ev"><b>Enviada</b> <span class="muted">${fmtDate(r.enviadoEm||r.criado)} · ${esc(MODELOS[r.modelo]?.n||"")} · ${r.ident==="anonimo"?"anônima":"identificada"}</span><br><span class="muted" style="font-size:.86rem">Para: ${esc(r.para||cat?.org||"")}${r.protoOrg?` · protocolo do órgão <span class="mono">${esc(r.protoOrg)}</span>`:""}</span></div>
      ${(r.respostas||[]).map(x=>`<div class="ev resp"><b>Resposta${x.de?" de "+esc(x.de):""}</b> <span class="muted">${fmtDate(x.em)}</span><p style="white-space:pre-wrap">${esc(x.texto)}</p></div>`).join("")}
      ${r.status==="resolvida"?`<div class="ev"><b>Resolvida</b> <span class="muted">${fmtDate(r.resolvidoEm||Date.now())}</span></div>`:""}
    </div>
    <form id="fProto" class="row" style="align-items:flex-end"><label class="f grow">Protocolo dado pelo órgão<input type="text" id="rsProto" value="${esc(r.protoOrg||"")}" placeholder="Número que o órgão informou"></label><button class="btn" type="submit">Salvar</button></form>
    <form id="fResp" class="stack card"><h3>Registrar resposta recebida</h3>
      <label class="f">Quem respondeu<input type="text" id="rsDe" placeholder="Ex.: Ouvidoria da Prefeitura"></label>
      <label class="f">Texto da resposta<textarea id="rsTx"></textarea></label>
      <button class="btn" type="submit">Salvar resposta</button></form>
    <div class="row">
      ${r.status!=="resolvida"?'<button class="btn primary" id="rsOk">Marcar como resolvida</button>':'<button class="btn" id="rsReopen">Reabrir</button>'}
      <button class="btn" id="rsCopy">Copiar texto enviado</button>
      ${st.k==="vencida"?'<button class="btn ipe" id="rsEsc">Escalar cobrança</button>':""}
      <button class="btn ghost" id="rsDel" style="margin-left:auto">Excluir</button>
    </div>
    <div id="rsDelConf" hidden class="notice"><span class="grow">Excluir esta cobrança do seu perfil? Não dá para desfazer.</span><button class="btn small" id="rsDelYes">Excluir</button></div>`,el=>{
      $("#fProto",el).onsubmit=async e=>{e.preventDefault();r.protoOrg=$("#rsProto",el).value.trim();await Store.saveRec(r);toast("Protocolo salvo")};
      $("#fResp",el).onsubmit=async e=>{e.preventDefault();const t=$("#rsTx",el).value.trim();if(!t)return;r.respostas=[...(r.respostas||[]),{de:$("#rsDe",el).value.trim(),texto:t,em:Date.now()}];if(r.status!=="resolvida")r.status="respondida";await Store.saveRec(r);closeSheet();render();openRec(r.id)};
      const ok=$("#rsOk",el);if(ok)ok.onclick=async()=>{r.status="resolvida";r.resolvidoEm=Date.now();await Store.saveRec(r);const mm=S.mural.find(x=>x.id==="m_"+r.id);if(mm){const {id:_i,_autor,...rest}=mm;await Store.put("mural","mural",mm.id,{...rest,status:"resolvido",resolvidoEm:Date.now()})}closeSheet();render();toast("Marcada como resolvida")};
      const ro=$("#rsReopen",el);if(ro)ro.onclick=async()=>{r.status=r.respostas?.length?"respondida":"enviada";await Store.saveRec(r);closeSheet();render()};
      $("#rsCopy",el).onclick=()=>copyText(`Assunto: ${r.assunto}\n\n${r.corpo}`);

function oficiais(c){

  if(e&&e.eleitos2026&&hoje()<POSSE.governador){const x=e.eleitos2026;[["governador","Governador(a) eleito(a) em 2026"],["vice","Vice-governador(a) eleito(a) em 2026"]].forEach(([k,n])=>{if(x[k])o.estadual.eleitos.push(pReal(x[k],n,"estadual","TSE · eleições de 2026"))})}

    const gov=o.estadual.exec.find(p=>/^Governador/.test(p.cargo)); if(gov)L.push({p:gov,papel:"Executa: chefia o governo estadual"});
    L.push({p:secretarioPessoa("est",city,cat.pasta),papel:"Executa: comanda a pasta"});

    L.push({p:secretarioPessoa("min",city,cat.min),papel:"Executa: comanda o ministério"});
    const pr=o.federal.exec.find(p=>/^Presidente/.test(p.cargo)); if(pr)L.push({p:pr,papel:"Chefia o governo federal"});
    for(const g of o.federal.leg)L.push({p:g,papel:"Fiscaliza em nome do seu estado"});
  }
  registerPeople(L.map(x=>x.p));

}

/* ---------- CONTRIBUIÇÕES COM VERIFICAÇÃO ---------- */
const OFICIAIS=["gov.br","leg.br","jus.br","mp.br","def.br","mil.br"];
const DIARIOS=["diariomunicipal","diariooficial","imprensaoficial","doem.","dom.","doe."];
function hostOf(u){try{const x=new URL(u);return /^https?:$/.test(x.protocol)?x.hostname.toLowerCase():""}catch(e){return ""}}
/* Domínios oficiais fora de .gov.br, conferidos um a um (o Rio usa .rio). */
const OFICIAIS_EXTRA=["prefeitura.rio","camara.rio","1746.rio","carioca.rio"];
const ehOficial=h=>OFICIAIS.some(s=>h===s||h.endsWith("."+s))||OFICIAIS_EXTRA.some(s=>h===s||h.endsWith("."+s));
function fonteTipo(u){const h=hostOf(u);if(!h)return "nenhuma";if(ehOficial(h))return "oficial";if(DIARIOS.some(d=>h.includes(d)))return "diario";return "outra"}
const FONTE_TXT={oficial:"Fonte oficial",diario:"Diário oficial",outra:"Fonte não oficial",nenhuma:"Sem fonte"};
const emailOk=e=>/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e||"");
const emailOficial=e=>ehOficial(((e||"").split("@")[1]||"").toLowerCase());
const isCurador=pk=>Dados.curadores.includes(pk);
const LIMITE_DIA=10, IDADE_MIN_DIAS=3;
function idadeDias(pk){const t=Nostr.primeiro&&Nostr.primeiro[pk];if(!Nostr.ready)return 99;if(!t)return 0;return (Date.now()/1000-t)/86400}
function atestado(pk){return S.atestados.some(a=>a.id===pk&&Dados.atestadores.includes(a._autor)&&!a.revogado)}
const govbrAtivo=()=>Dados.atestadores.length>0;
function pesoVoto(pk){if(isCurador(pk))return 3;if(govbrAtivo())return atestado(pk)?1:0;return idadeDias(pk)<IDADE_MIN_DIAS?0:1}
const podeConferir=pk=>isCurador(pk)||(govbrAtivo()?atestado(pk):true);
function autorDe(c){return c._autor||c.autor}
function avaliar(c){
  const autor=autorDe(c);
  if(c.campo==="email"&&!emailOk(c.valor))return {st:"recusado",motivo:"E-mail em formato inválido.",conf:0,cont:0,precisa:0};
  const doDia=S.contribs.filter(x=>autorDe(x)===autor&&x.criado<=c.criado&&c.criado-x.criado<864e5).length;
  if(doDia>LIMITE_DIA)return {st:"recusado",motivo:"A mesma chave passou do limite de contribuições por dia.",conf:0,cont:0,precisa:0};
  const ft=fonteTipo(c.fonte); let precisa=ft==="oficial"||ft==="diario"?3:5;
  if(c.campo==="email"&&!emailOficial(c.valor))precisa=Math.max(precisa,5);
  if(c.campo==="contato"&&c.valor&&c.valor.email&&!emailOficial(c.valor.email))precisa=Math.max(precisa,5);
  let conf=0,cont=0,curOk=false,curNo=false,nconf=0,ncont=0;
  for(const v of S.cvotos){if(v.c!==c.id||v.uid===autor)continue;const w=pesoVoto(v.uid);
    if(v.v>0){conf+=w;nconf++;if(isCurador(v.uid))curOk=true}else{cont+=w;ncont++;if(isCurador(v.uid))curNo=true}}
  if(isCurador(autor)&&!curNo)curOk=true;
  const base={conf,cont,precisa,ft,nconf,ncont};
  if(curNo)return {...base,st:"removido",motivo:"Retirado pela curadoria."};
  if(cont>=2&&cont>=conf)return {...base,st:"contestado"};
  if(curOk||conf>=precisa)return {...base,st:"verificado"};
  return {...base,st:"pendente"};
}
function valorDe(alvo){
  const cs=S.contribs.filter(c=>c.alvo===alvo).map(c=>({c,a:avaliar(c)}));
  const ver=cs.filter(x=>x.a.st==="verificado").sort((x,y)=>y.a.conf-x.a.conf||y.c.criado-x.c.criado);
  const pend=cs.filter(x=>x.a.st==="pendente").sort((x,y)=>y.c.criado-x.c.criado);
  const div=new Set(ver.map(x=>JSON.stringify(x.c.valor))).size>1;
  return {ver:ver[0]||null,divergencia:div,pend,todos:cs};
}
const ST_TXT={verificado:"Verificado",pendente:"Aguardando conferência",contestado:"Contestado",removido:"Removido pela curadoria",recusado:"Recusado"};
const ST_CLS={verificado:"s-resolvida",pendente:"s-enviada",contestado:"s-vencida",removido:"s-rascunho",recusado:"s-rascunho"};
function stPill(a){return `<span class="pill ${ST_CLS[a.st]}"><i></i>${ST_TXT[a.st]}${a.st==="pendente"?` · ${Math.floor(a.conf)}/${a.precisa}`:""}</span>`}
function valorTxt(c){return c.campo==="audiencia"?`${(c.valor&&c.valor.tema)||""} · ${c.valor&&c.valor.data?fmtDiaHora(c.valor.data+(c.valor.hora?"T"+c.valor.hora:"")):""}`:c.campo==="contato"?[c.valor&&c.valor.email,c.valor&&c.valor.telefone,c.valor&&c.valor.site&&(hostOf(c.valor.site)||c.valor.site)].filter(Boolean).join(" · "):c.campo==="canal"?`${(c.valor&&c.valor.nome)||""}${c.valor&&c.valor.telefone?" · "+c.valor.telefone:""}${c.valor&&c.valor.url?" · "+(hostOf(c.valor.url)||c.valor.url):""}`:c.campo==="email"?c.valor:c.campo==="aviso"?(c.valor&&c.valor.texto)||"":`${(c.valor&&c.valor.nome)||""}${c.valor&&c.valor.partido?" ("+c.valor.partido+")":""}`}
function curto(pk){return pk?pk.slice(0,8)+"…":"?"}
const REGRAS_HTML=`<details class="acc"><summary>Como evitamos erros e fraudes</summary><div class="body" style="font-size:.92rem">
  <p><b>Dado oficial vem primeiro.</b> Eleitos, partidos e mandatos vêm do TSE, da Câmara e do Senado e não podem ser editados. Moradores só podem anexar um alerta, com fonte, se alguém deixou o cargo.</p>

const alvoAud=(nivel,c,id)=>nivel==="mun"?`aud|${slugC(c)}|${id}`:`aud|${c.uf}|${id}`;
function audLocal(c,nivel){
  const pref=nivel==="mun"?`aud|${slugC(c)}|`:`aud|${c.uf}|`; const hojeS=hoje();
  return S.contribs.filter(x=>x.campo==="audiencia"&&x.alvo.startsWith(pref)&&x.valor&&x.valor.data>=hojeS)
    .map(x=>({c:x,a:avaliar(x)})).filter(x=>x.a.st==="verificado"||x.a.st==="pendente")
    .sort((x,y)=>(x.c.valor.data+(x.c.valor.hora||"")).localeCompare(y.c.valor.data+(y.c.valor.hora||"")));
}
function fmtDiaHora(iso){try{const d=new Date(iso.length<=10?iso+"T12:00":iso);return d.toLocaleDateString("pt-BR",{weekday:"short",day:"2-digit",month:"short"})+(iso.length>10?" · "+d.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"}):"")}catch(e){return iso}}
function gcalLink({titulo,inicio,local,detalhes}){
  const st=(inicio.length<=10?inicio+"T09:00":inicio).replace(/[-:]/g,"").slice(0,13)+"00";
  const d=new Date((inicio.length<=10?inicio+"T09:00":inicio)); const e=new Date(d.getTime()+2*3600e3);
  const p2=n=>String(n).padStart(2,"0"); const en=`${e.getFullYear()}${p2(e.getMonth()+1)}${p2(e.getDate())}T${p2(e.getHours())}${p2(e.getMinutes())}00`;
  return "https://calendar.google.com/calendar/render?action=TEMPLATE&text="+encodeURIComponent(titulo)+"&dates="+st+"/"+en+"&ctz=America/Sao_Paulo&location="+encodeURIComponent(local||"")+"&details="+encodeURIComponent(detalhes||"");
}
function audRowLocal(x){const v=x.c.valor;return `<button class="item-btn" data-audc="${esc(x.c.id)}"><span class="aud-date"><b>${esc(new Date(v.data+"T12:00").getDate())}</b><span>${esc(new Date(v.data+"T12:00").toLocaleDateString("pt-BR",{month:"short"}))}</span></span><span class="grow stack" style="gap:3px"><b>${esc(v.tema)}</b><span class="muted" style="font-size:.84rem">${esc([v.hora,v.orgao,v.local].filter(Boolean).join(" · "))}</span><span>${x.a.st==="verificado"?'<span class="pill s-resolvida"><i></i>Conferida</span>':'<span class="pill s-enviada"><i></i>Aguardando conferência</span>'}</span></span></button>`}
function audRowCamara(a){const d=new Date(a.inicio);return `<button class="item-btn" data-audf="${esc(a.id)}"><span class="aud-date"><b>${d.getDate()}</b><span>${esc(d.toLocaleDateString("pt-BR",{month:"short"}))}</span></span><span class="grow stack" style="gap:3px"><b>${esc(a.tema.length>160?a.tema.slice(0,157)+"…":a.tema)}</b><span class="muted" style="font-size:.84rem">${esc(d.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"}))} · ${esc(a.orgao||"Câmara dos Deputados")}</span></span></button>`}

    <div class="row"><button class="support" data-apoio="${esc(id)}" aria-pressed="${apoiei(id)}" style="flex-direction:row;gap:8px;padding:8px 14px"><b>${n}</b><small>${apoiei(id)?"Apoiado":"Apoiar"}</small></button><button class="btn" id="shr">Copiar convite para apoio</button></div>
    <h3>Enviar a parlamentares</h3><div class="list">${alvos.map(x=>personRow(x)).join("")}</div>
    <div class="mail"><pre id="ofi">${esc(ofi)}</pre></div><div class="row">${emailsDe(alvos).length?`<a class="btn primary" href="${esc(mailtoHref({bcc:emailsDe(alvos),subject:"Sugestão de projeto de lei: "+p.titulo,body:ofi}))}">Enviar por e-mail (${emailsDe(alvos).length})</a>`:""}<button class="btn" id="ofiC">Copiar ofício</button></div>
    <div class="why"><b>E se a Câmara não quiser?</b> A iniciativa popular permite protocolar o projeto diretamente: no município, com assinaturas de 5% do eleitorado; no Congresso, com 1% do eleitorado nacional, distribuído por pelo menos 5 estados e com no mínimo 0,3% dos eleitores de cada um.</div>
    ${Dados.disp?"":`<p class="muted" style="font-size:.82rem"><span class="pill demo">Demonstração</span> Parlamentares fictícios neste modo.</p>`}`,el=>{
      $("#shr",el).onclick=()=>copyText(share); $("#ofiC",el).onclick=()=>copyText(ofi,$("#ofi",el)); bindPeople(el);
      el.querySelectorAll("[data-apoio]").forEach(b=>b.onclick=async()=>{const sid=`${id}__${S.uid}`;if(apoiei(id))await Store.del("apoios","apoios",sid);else await Store.put("apoios","apoios",sid,{alvo:id,uid:S.uid,em:Date.now()});closeSheet();render();openProp(id)});
    });
}

/* ---------- rede descentralizada (Nostr) para a versão instalável ---------- */
const RELAYS=["wss://relay.damus.io","wss://nos.lol","wss://relay.primal.net"];
const APP_TAG="cidadania-app-v1";
const COLKEY={mural:"mural",propostas:"propostas",apoios:"apoios",diretorio:"diretorio",cidades_mundo:"cidadesMundo",contrib:"contribs",cvoto:"cvotos",atesta:"atestados"};
const CACHEKEY={mural:"cid.mural",propostas:"cid.prop",apoios:"cid.apoios",cidadesMundo:"cid.mundo",diretorio:"cid.dir",contribs:"cid.contrib",cvotos:"cid.cvoto",atestados:"cid.atesta"};
let renderTimer=null;
function scheduleRender(){clearTimeout(renderTimer);renderTimer=setTimeout(()=>{const a=document.activeElement;if(a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)&&$("#app").contains(a)){scheduleRender();return}render()},250)}
function cacheShared(key){lsSet(CACHEKEY[key],S[key])}
const Nostr={
  pool:null,sk:null,pk:null,ready:false,seen:{},primeiro:{},relaysOk:new Set(),
  init(){
    if(!window.NostrTools)return false; const T=window.NostrTools;
    try{
      let h=lsGet("cid.nsk",null); if(!h){h=T.utils.bytesToHex(T.generateSecretKey());lsSet("cid.nsk",h)}
      this.sk=T.utils.hexToBytes(h); this.pk=T.getPublicKey(this.sk); this.pool=new T.SimplePool(); this.ready=true;
      S.uid=this.pk; S.rede="nostr";
      this.pool.subscribeMany(RELAYS,{kinds:[30078],"#t":[APP_TAG],limit:3000},{onevent:ev=>this.recv(ev),oneose:()=>{S.redeOk=true;scheduleRender()}});
      setTimeout(()=>{if(!S.redeOk){S.redeOk=false;scheduleRender()}},8000);
      return true;
    }catch(e){console.warn(e);return false}
  },
  recv(ev){
    const d=(ev.tags.find(t=>t[0]==="d")||[])[1]||""; const m=d.match(/^cid:([a-z_]+):(.+)$/); if(!m)return;
    const col=m[1],id=m[2],key=COLKEY[col]; if(!key)return;
    if(!this.primeiro[ev.pubkey]||ev.created_at<this.primeiro[ev.pubkey])this.primeiro[ev.pubkey]=ev.created_at;
    if((col==="apoios"||col==="cvoto")&&id.split("__")[1]!==ev.pubkey)return;
    if(col==="propostas"||col==="mural"){/* autoria: só o autor original pode alterar */}
    const prev=this.seen[d]; if(prev){if(prev.pubkey!==ev.pubkey)return;if(prev.created_at>ev.created_at)return}
    this.seen[d]={pubkey:ev.pubkey,created_at:ev.created_at};
    let data=null; if(ev.content){try{data=JSON.parse(ev.content)}catch(e){return}}
    applyShared(key,id,data,ev.pubkey); scheduleRender();
  },
  async publish(col,id,data){
    const T=window.NostrTools;
    const ev=T.finalizeEvent({kind:30078,created_at:Math.floor(Date.now()/1000),tags:[["d",`cid:${col}:${id}`],["t",APP_TAG],["c",col]],content:data?JSON.stringify(data):""},this.sk);
    this.seen[`cid:${col}:${id}`]={pubkey:this.pk,created_at:ev.created_at};
    if(!this.primeiro[this.pk])this.primeiro[this.pk]=ev.created_at;
    const res=await Promise.allSettled(this.pool.publish(RELAYS,ev));
    const ok=res.filter(r=>r.status==="fulfilled").length; if(!ok)toast("Sem conexão com a rede agora. Tente publicar de novo mais tarde.");
    return ok>0;
  },
  npub(){try{return window.NostrTools.nip19.npubEncode(this.pk)}catch(e){return this.pk}},
  nsec(){try{return window.NostrTools.nip19.nsecEncode(this.sk)}catch(e){return ""}},
  importar(nsec){const T=window.NostrTools;const r=T.nip19.decode(nsec.trim());if(r.type!=="nsec")throw new Error("tipo");lsSet("cid.nsk",T.utils.bytesToHex(r.data));location.reload()}
};
function applyShared(key,id,data,autor){
  if(key==="diretorio"){if(data)S.diretorio[id]={id,...data};else delete S.diretorio[id];cacheShared(key);return}
  const arr=S[key]; const i=arr.findIndex(x=>x.id===id);
  if(!data){if(i>=0)arr.splice(i,1)} else {const doc={id,...data,_autor:autor}; if(key==="contribs"||key==="cvotos"){doc.autor=autor;if(key==="cvotos")doc.uid=autor} if(i>=0)arr[i]=doc; else arr.push(doc)}
  cacheShared(key);
}

/* ---------- ESCOLA CÍVICA: trilhas, aulas, XP e badges ---------- */
const TRILHAS = [
 {id:"t1",n:"Fundamentos da República",d:"Quem manda em quê, e como as leis nascem.",aulas:[
  {id:"t1a1",t:"Três poderes, três funções",min:4,html:`<p>Em cada nível de governo o poder é dividido para que ninguém mande sozinho. É a ideia de freios e contrapesos: cada poder limita os outros.</p>
   <div class="powers"><div><b>Executivo</b>Governa e executa: presta serviços, contrata obras, gasta o orçamento. Prefeito, governador, presidente e seus secretários e ministros.</div><div><b>Legislativo</b>Faz as leis, aprova o orçamento e fiscaliza o Executivo. Vereadores, deputados estaduais, deputados federais e senadores.</div><div><b>Judiciário</b>Julga conflitos e garante que a lei seja cumprida. Não tem cargos eleitos no Brasil.</div></div>
   <p>O <b>Ministério Público</b> não é um quarto poder: é uma instituição independente que defende a sociedade e pode processar o próprio governo.</p>`,
   qs:[{q:"Quem aprova o orçamento da cidade?",o:["O prefeito, sozinho","A Câmara Municipal","O Tribunal de Justiça"],a:1,e:"O prefeito envia a proposta, mas quem aprova é a Câmara. Por isso vereadores respondem pelo que é priorizado."},
       {q:"O que o Judiciário faz?",o:["Executa obras","Julga conflitos e aplica a lei","Cria impostos"],a:1,e:"Juízes não executam políticas nem criam impostos: julgam casos concretos à luz da lei."}]},
  {id:"t1a2",t:"Município, estado e União",min:5,html:`<p>O Brasil é uma federação: cada esfera tem tarefas próprias, definidas na Constituição (arts. 21 a 30). Errar a esfera é o motivo mais comum de reclamações sem resposta.</p>
   <div class="tbl-wrap"><table><thead><tr><th>Esfera</th><th>Cuida de</th><th>Quem governa</th></tr></thead><tbody>
   <tr><td><span class="esf municipal" data-l="M">Municipal</span></td><td>Ruas, lixo, iluminação, ônibus urbanos, creches, ensino fundamental, postos de saúde, zoneamento</td><td>Prefeito(a) e Câmara de Vereadores</td></tr>
   <tr><td><span class="esf estadual" data-l="E">Estadual</span></td><td>Polícias, ensino médio, hospitais regionais, rodovias estaduais, trens metropolitanos</td><td>Governador(a) e Assembleia Legislativa</td></tr>
   <tr><td><span class="esf federal" data-l="F">Federal</span></td><td>Previdência (INSS), BRs, universidades federais, moeda, relações exteriores, regras de energia e telecomunicações</td><td>Presidente e Congresso Nacional</td></tr></tbody></table></div>`,
   qs:[{q:"Uma creche municipal está sem vagas. A quem cobrar primeiro?",o:["Ministério da Educação","Secretaria Municipal de Educação","Governo do estado"],a:1,e:"Educação infantil é prioridade do município (Constituição, art. 211)."},
       {q:"Quem administra as polícias Militar e Civil?",o:["A prefeitura","O governo do estado","A União"],a:1,e:"Segurança pública ostensiva e investigativa é estadual (Constituição, art. 144). Guardas municipais protegem bens e serviços da cidade."}]},
  {id:"t1a3",t:"Competências comuns: quando todos respondem",min:4,html:`<p>Saúde, educação, meio ambiente e assistência social são <b>competências comuns</b> (Constituição, art. 23): as três esferas financiam e cada uma gere uma parte.</p>
   <p>No SUS (Sistema Único de Saúde), por exemplo, a atenção básica costuma ser municipal, muitos hospitais são estaduais e as regras e boa parte do dinheiro vêm da União. Para cobrar a pessoa certa, descubra <b>quem administra a unidade</b>: a placa na fachada e o site da secretaria costumam dizer.</p>
   <div class="why"><b>Dica.</b> Na dúvida, envie ao órgão mais próximo e peça que encaminhe ao responsável. Pela Lei 13.460/2017, a ouvidoria deve encaminhar a manifestação, não descartá-la.</div>`,
   qs:[{q:"Por que muitas queixas de saúde ficam sem resposta?",o:["Porque saúde é só federal","Porque foram enviadas a uma esfera que não administra a unidade","Porque saúde não tem ouvidoria"],a:1,e:"Na competência comum, cada unidade tem um gestor. Mandar ao gestor errado atrasa tudo."},
       {q:"O que significa competência comum?",o:["Só a União decide","As três esferas atuam e financiam juntas","Nenhuma esfera é responsável"],a:1,e:"Competência comum é responsabilidade compartilhada, com divisão de tarefas entre as esferas."}]},
  {id:"t1a4",t:"Como nasce uma lei",min:5,html:`<ol class="flow">
   <li><div><b>Proposta</b><br><span class="muted">Um parlamentar, o chefe do Executivo, um tribunal ou a população (iniciativa popular) apresenta o projeto.</span></div></li>
   <li><div><b>Comissões</b><br><span class="muted">Analisam constitucionalidade, mérito e impacto no orçamento. Muitos projetos param aqui, e é aqui que a pressão popular mais conta.</span></div></li>
   <li><div><b>Plenário</b><br><span class="muted">Todos votam. No Congresso, o projeto passa pela Câmara e pelo Senado.</span></div></li>
   <li><div><b>Sanção ou veto</b><br><span class="muted">O chefe do Executivo tem 15 dias úteis para sancionar ou vetar. O Legislativo pode derrubar o veto.</span></div></li>
   <li><div><b>Publicação</b><br><span class="muted">A lei sai no Diário Oficial. Muitas ainda precisam de regulamentação por decreto para funcionar.</span></div></li></ol>`,
   qs:[{q:"Em que fase a pressão popular costuma pesar mais?",o:["Nas comissões","Na publicação","Depois da sanção"],a:0,e:"É nas comissões que relatores definem o texto e o ritmo. Audiências públicas acontecem ali."},
       {q:"O prefeito vetou uma lei. Ela morreu?",o:["Sim, sempre","Não: a Câmara pode derrubar o veto","Só o juiz decide"],a:1,e:"O Legislativo pode derrubar o veto por maioria absoluta, e a lei é promulgada."}]}
 ]},
 {id:"t2",n:"Dinheiro público",d:"De onde vem, para onde vai e quem fiscaliza.",aulas:[
  {id:"t2a1",t:"De onde vem o dinheiro",min:5,html:`<p>Cada esfera tem impostos próprios:</p>
   <p><b>Municípios:</b> IPTU (Imposto Predial e Territorial Urbano), ISS (Imposto Sobre Serviços) e ITBI (Imposto sobre Transmissão de Bens Imóveis).<br><b>Estados:</b> ICMS (Imposto sobre Circulação de Mercadorias e Serviços), IPVA (Imposto sobre a Propriedade de Veículos Automotores) e ITCMD (Imposto sobre Transmissão Causa Mortis e Doação).<br><b>União:</b> Imposto de Renda, IPI (Imposto sobre Produtos Industrializados) e contribuições sociais.</p>
   <p>A reforma tributária aprovada em 2023 vai substituir aos poucos ICMS e ISS pelo IBS (Imposto sobre Bens e Serviços), com transição até 2033.</p>
   <p>Muitas cidades pequenas vivem sobretudo de <b>transferências</b>: o FPM (Fundo de Participação dos Municípios), repasses do SUS e do Fundeb (Fundo de Manutenção e Desenvolvimento da Educação Básica).</p>`,
   qs:[{q:"O IPTU é imposto de qual esfera?",o:["Municipal","Estadual","Federal"],a:0,e:"IPTU, ISS e ITBI são municipais."},
       {q:"De onde vem boa parte do dinheiro das cidades pequenas?",o:["Multas de trânsito","Transferências como o FPM","Venda de imóveis"],a:1,e:"O FPM e os repasses de saúde e educação sustentam a maioria dos pequenos municípios."}]},
  {id:"t2a2",t:"PPA, LDO e LOA",min:4,html:`<p>Toda política pública depende de três leis votadas pelo Legislativo:</p>
   <p><b>PPA (Plano Plurianual)</b>: metas para quatro anos, aprovado no primeiro ano de cada mandato.<br><b>LDO (Lei de Diretrizes Orçamentárias)</b>: prioridades e regras do ano seguinte.<br><b>LOA (Lei Orçamentária Anual)</b>: quanto será gasto em cada coisa.</p>
   <p>Sem previsão na LOA, uma obra não sai. Perguntar "quanto está previsto para isso na LOA?" é uma das cobranças mais concretas que existem.</p>`,
   qs:[{q:"Qual lei diz quanto será gasto em cada área no ano?",o:["PPA","LDO","LOA"],a:2,e:"A LOA é o orçamento anual propriamente dito."},
       {q:"Por quanto tempo vale o PPA?",o:["Um ano","Quatro anos","Dez anos"],a:1,e:"O PPA cobre quatro anos e atravessa mandatos: começa no segundo ano de um e termina no primeiro do seguinte."}]},
  {id:"t2a3",t:"Emendas parlamentares",min:4,html:`<p>Vereadores, deputados e senadores podem alterar o orçamento com <b>emendas</b>, indicando dinheiro para obras e serviços.</p>
   <p>No âmbito federal, as emendas individuais são de execução obrigatória desde a Emenda Constitucional 86/2015, e as de bancada estadual desde a Emenda 100/2019. Nos últimos anos o STF (Supremo Tribunal Federal) passou a exigir mais transparência sobre quem indicou cada emenda e onde o dinheiro foi parar.</p>
   <div class="why"><b>Cobrança possível.</b> Pergunte ao seu representante quanto ele destinou ao problema que você relatou e acompanhe a execução no Portal da Transparência.</div>`,
   qs:[{q:"O que é uma emenda parlamentar ao orçamento?",o:["Uma lei penal","Uma alteração que direciona recursos","Um tipo de imposto"],a:1,e:"A emenda muda a destinação de recursos dentro do orçamento."},
       {q:"Emendas individuais federais são...",o:["Opcionais para o governo","De execução obrigatória","Proibidas"],a:1,e:"Desde 2015 o governo é obrigado a executá-las, salvo impedimentos técnicos."}]},
  {id:"t2a4",t:"Transparência e controle",min:5,html:`<p>A LRF (Lei de Responsabilidade Fiscal, Lei Complementar 101/2000) limita gastos com pessoal a 60% da receita corrente líquida em estados e municípios e a 50% na União, e obriga a publicar relatórios de gestão.</p>
   <p>Quem fiscaliza as contas são os <b>Tribunais de Contas</b>: o TCU (Tribunal de Contas da União) para dinheiro federal e os tribunais estaduais para estados e municípios. As cidades de São Paulo e do Rio de Janeiro têm tribunais de contas próprios.</p>
   <p>Qualquer cidadão pode denunciar irregularidades ao Tribunal de Contas, e todo governo deve manter um portal de transparência com receitas, despesas e contratos.</p>`,
   qs:[{q:"Quem julga as contas de um prefeito?",o:["O Tribunal de Contas, com parecer, e a Câmara","Só o prefeito","O TSE"],a:0,e:"O Tribunal de Contas emite parecer técnico e a Câmara Municipal julga as contas do prefeito."},
       {q:"Qual lei limita os gastos com pessoal?",o:["Lei de Acesso à Informação","Lei de Responsabilidade Fiscal","Estatuto da Cidade"],a:1,e:"A LRF fixa limites de despesa com pessoal e regras de equilíbrio fiscal."}]}
 ]},
 {id:"t3",n:"Participação e controle social",d:"As ferramentas legais para cobrar e decidir junto.",aulas:[
  {id:"t3a1",t:"Ouvidoria e o Código do Usuário",min:3,html:`<p>A Lei 13.460/2017, conhecida como Código de Defesa do Usuário do Serviço Público, garante o direito de reclamar, sugerir, denunciar e elogiar. O órgão deve responder em até <b>30 dias</b>, prorrogáveis uma vez por mais 30, com justificativa.</p>
   <p>A ouvidoria não pode exigir que você explique por que está reclamando, e deve proteger sua identidade quando você pede sigilo.</p>`,
   qs:[{q:"Qual o prazo de resposta de uma ouvidoria?",o:["5 dias","30 dias, prorrogáveis por mais 30","Não há prazo"],a:1,e:"É o prazo da Lei 13.460/2017, art. 16."},
       {q:"Você pode pedir sigilo da sua identidade?",o:["Sim","Não, nunca","Só com advogado"],a:0,e:"A lei garante a proteção dos dados do manifestante."}]},
  {id:"t3a2",t:"Lei de Acesso à Informação",min:4,html:`<p>A LAI (Lei 12.527/2011) permite que qualquer pessoa peça documentos e dados públicos <b>sem justificar o motivo</b>. O órgão tem 20 dias para responder, prorrogáveis por mais 10. Se negar, cabe recurso.</p>
   <p>Bons pedidos são específicos: "cópia do contrato de coleta de lixo vigente e dos três últimos relatórios de medição" funciona melhor que "quero saber sobre o lixo".</p>
   <p>O pedido exige identificação, mas o órgão não pode exigir dados que dificultem o acesso.</p>`,
   qs:[{q:"Você precisa justificar um pedido pela LAI?",o:["Sim, sempre","Não","Só para dados de saúde"],a:1,e:"A lei proíbe exigir motivos (art. 10, §3º)."},
       {q:"Qual destes é o melhor pedido?",o:["Quero saber tudo sobre a obra","Cópia do contrato da obra da Rua X e das medições de 2026","Por que a obra é ruim?"],a:1,e:"Pedidos específicos, de documentos existentes, recebem respostas mais completas."}]},
  {id:"t3a3",t:"Conselhos, audiências e plano diretor",min:5,html:`<p>O Estatuto da Cidade (Lei 10.257/2001) exige gestão democrática: cidades com mais de 20 mil habitantes precisam de <b>plano diretor</b>, revisto pelo menos a cada dez anos, com audiências públicas.</p>
   <p><b>Conselhos municipais</b> de saúde, educação, assistência e meio ambiente têm vagas para a sociedade civil e acompanham políticas e contas. Suas reuniões costumam ser abertas ao público.</p>
   <p><b>Audiências públicas</b> nas câmaras e assembleias podem ser pedidas por qualquer parlamentar, e muitas vezes por iniciativa de moradores organizados.</p>`,
   qs:[{q:"Qual cidade é obrigada a ter plano diretor?",o:["Só capitais","Cidades com mais de 20 mil habitantes","Nenhuma"],a:1,e:"É exigência da Constituição (art. 182) e do Estatuto da Cidade."},
       {q:"Para que servem os conselhos municipais?",o:["Substituir a Câmara","Acompanhar políticas com participação social","Julgar crimes"],a:1,e:"Eles dão voz à sociedade civil na gestão e no controle das políticas."}]},
  {id:"t3a4",t:"Iniciativa popular, plebiscito e referendo",min:4,html:`<p>A Constituição (art. 14) prevê três formas de democracia direta:</p>
   <p><b>Iniciativa popular:</b> a população apresenta um projeto de lei. No Congresso, precisa de 1% do eleitorado nacional, em pelo menos 5 estados, com no mínimo 0,3% dos eleitores de cada um. Nos municípios, 5% do eleitorado (art. 29, XIII). A Lei da Ficha Limpa nasceu assim.</p>
   <p><b>Plebiscito:</b> consulta antes de uma decisão. <b>Referendo:</b> consulta para confirmar ou rejeitar algo já aprovado.</p>`,
   qs:[{q:"Qual lei famosa nasceu de iniciativa popular?",o:["Lei da Ficha Limpa","Lei de Responsabilidade Fiscal","Código Penal"],a:0,e:"A Ficha Limpa (Lei Complementar 135/2010) teve mais de 1,6 milhão de assinaturas."},
       {q:"Qual a diferença entre plebiscito e referendo?",o:["Nenhuma","Plebiscito vem antes da decisão; referendo depois","Referendo é só municipal"],a:1,e:"No plebiscito o povo decide antes; no referendo confirma ou rejeita algo já aprovado."}]},
  {id:"t3a5",t:"Ministério Público e ação popular",min:4,html:`<p>O <b>Ministério Público</b> recebe denúncias sobre problemas coletivos, como saúde, meio ambiente, patrimônio público e serviços essenciais, e pode abrir inquérito civil ou mover ação civil pública contra o próprio governo.</p>
   <p>A <b>ação popular</b> (Constituição, art. 5º, LXXIII) permite que qualquer cidadão vá à Justiça para anular ato lesivo ao patrimônio público, ao meio ambiente ou à moralidade administrativa, sem pagar custas, salvo má-fé.</p>
   <p>Quem não pode pagar advogado conta com a <b>Defensoria Pública</b>.</p>`,
   qs:[{q:"Quem pode propor ação popular?",o:["Só partidos","Qualquer cidadão","Só o Ministério Público"],a:1,e:"Qualquer cidadão com título de eleitor é parte legítima."},
       {q:"Um esgoto a céu aberto ameaça um bairro e a prefeitura ignora as queixas. Um bom caminho é...",o:["Desistir","Representar ao Ministério Público","Votar em branco"],a:1,e:"Problemas coletivos e omissão persistente são casos típicos para o Ministério Público."}]},
  {id:"t3a6",t:"Onde encontrar dados oficiais",min:4,html:`<p>Quase tudo o que o poder público decide precisa ser publicado. Nomeações, exonerações, contratos e leis saem no <b>Diário Oficial</b>: o do município, o do estado ou o da União, no site in.gov.br. Muitas cidades pequenas publicam no diário da associação de municípios do seu estado.</p>
   <p>O <b>Portal da Transparência</b> de cada governo mostra servidores, salários, despesas e contratos. A <b>Carta de Serviços ao Usuário</b>, obrigatória pela Lei 13.460/2017, lista os canais de atendimento de cada órgão.</p>
   <p>Para que outras pessoas confiram, o que vale é o <b>link</b> da página ou do PDF, com a data da edição e a página. Um arquivo recebido por mensagem, sem link, não pode ser conferido por ninguém.</p>`,
   qs:[{q:"Onde fica a prova mais forte de que alguém foi nomeado secretário?",o:["Numa notícia de jornal","No Diário Oficial, no ato de nomeação","Numa postagem em rede social"],a:1,e:"A nomeação só vale quando publicada no Diário Oficial."},

}
function bindBadges(){document.querySelectorAll("[data-badge]").forEach(x=>x.onclick=()=>{const b=BADGES.find(y=>y.id===x.dataset.badge);const on=badgesGanhos().some(y=>y.id===b.id);
  openSheet(b.n,`<div class="celebrate">${badgeSvg(b,on,120)}<span class="eyebrow">${TIER[b.tier].n} · ${FAMILIA[b.f]}</span><p>${on?"Conquistado.":"Como ganhar:"} ${esc(b.d)}</p></div>`)})}

/* ---------- PERFIL ---------- */
let perfFiltro="todas";
function viewPerfil(){
  const p=S.perfil; const all=S.reclamacoes;
  const cnt=k=>all.filter(r=>statusOf(r).k===k).length;
  let list=all; if(perfFiltro!=="todas")list=all.filter(r=>statusOf(r).k===perfFiltro);
  return `<div class="person"><span class="avatar" style="background:var(--accent);color:var(--accent-ink);width:56px;height:56px;font-size:1.2rem">${esc((p.nome||"?").split(" ").map(x=>x[0]).slice(0,2).join(""))}</span><div class="grow"><h2>${esc(p.nome)}</h2><span class="muted">Conta por e-mail · desde ${fmtDate(p.desde||Date.now())}</span></div></div>
  <div class="stat-row"><div class="stat"><b>${all.length}</b><span>Cobranças</span></div><div class="stat"><b>${cnt("respondida")+cnt("resolvida")}</b><span>Com resposta</span></div><div class="stat"><b>${cnt("resolvida")}</b><span>Resolvidas</span></div><div class="stat"><b>${cnt("vencida")}</b><span>Prazo vencido</span></div></div>
  <section class="stack"><div class="section-head"><h2>Histórico</h2></div>
    <div class="seg" role="group">${[["todas","Todas"],["enviada","Aguardando"],["respondida","Respondidas"],["resolvida","Resolvidas"],["vencida","Vencidas"]].map(([k,n])=>`<button data-pf2="${k}" aria-pressed="${perfFiltro===k}">${n}</button>`).join("")}</div>
    ${list.length?`<div class="list">${list.map(recItem).join("")}</div>`:`<div class="card flat empty"><p><b>${all.length?"Nada com esse filtro.":"Seu histórico está vazio."}</b></p>${all.length?"":'<a class="btn primary" href="#relatar">Relatar o primeiro problema</a>'}</div>`}
  </section>
  ${levelCard()}
  ${badgesSection()}
  <section class="card stack"><h3>Dados para os modelos de e-mail</h3>
    <p class="muted" style="font-size:.9rem">Só entram nas mensagens que você enviar identificado. ${S.online?"Ficam guardados na sua área privada do app.":"Ficam guardados neste aparelho."}</p>
    <form id="fPerf" class="stack">
      <div class="grid2"><label class="f">Nome completo<input type="text" id="pfNome" value="${esc(p.nome||"")}"></label><label class="f">E-mail<input type="email" id="pfEmail" value="${esc(p.email||"")}"></label></div>
      <div class="grid2"><label class="f">CPF<input type="text" id="pfCpf" inputmode="numeric" value="${esc(p.cpf||"")}" placeholder="000.000.000-00"></label><label class="f">Telefone<input type="tel" id="pfTel" value="${esc(p.telefone||"")}"></label></div>
      <label class="f">Cidade onde vota <small>Mostra ao político que você é eleitor(a) dele.</small><input type="text" id="pfVoto" value="${esc(p.cidadeVoto||"")}" placeholder="Ex.: Ouro Preto (MG)"></label>
      <div class="grid2"><label class="f">Seu bairro <small>Abre o mural já no seu bairro.</small><input type="text" id="pfBai" value="${esc(p.bairro||"")}"></label><label class="f">Sua rua<input type="text" id="pfRua" value="${esc(p.rua||"")}"></label></div>
      <button class="btn primary" type="submit">Salvar dados</button>
    </form></section>
  ${redeCard()}
  <div class="row"><button class="btn ghost" id="sair">Sair da conta</button></div>
  <div id="sairConf" hidden class="notice"><span class="grow">${S.online?"Sair apaga os dados deste aparelho. Suas cobranças continuam guardadas na sua conta.":"Sair apaga deste aparelho o perfil e todas as cobranças. Não dá para desfazer."}</span><button class="btn small" id="sairYes">Sair</button></div>`;
}
function bindPerfil(){
  document.querySelectorAll("[data-pf2]").forEach(b=>b.onclick=()=>{perfFiltro=b.dataset.pf2;render()});
  bindRecItems(); bindBadges(); bindRede();
  $("#pfCpf").oninput=e=>{e.target.value=maskCpf(e.target.value)};
  $("#fPerf").onsubmit=async e=>{e.preventDefault();await Store.savePerfil({...S.perfil,nome:$("#pfNome").value.trim()||S.perfil.nome,email:$("#pfEmail").value.trim(),cpf:$("#pfCpf").value.trim(),telefone:$("#pfTel").value.trim(),cidadeVoto:$("#pfVoto").value.trim(),bairro:limpaRegiao($("#pfBai").value),rua:limpaRegiao($("#pfRua").value),cidadeCasa:S.cidade.nome});toast("Dados salvos");render()};
  $("#sair").onclick=()=>{$("#sairConf").hidden=false};
  $("#sairYes").onclick=()=>{["cid.perfil","cid.tut","cid.cidade","cid.rec"].forEach(k=>{try{localStorage.removeItem(k)}catch(e){}});S.perfil=null;S.tutorialVisto=false;S.cidade=null;if(!S.online)S.reclamacoes=[];location.hash="";render()};
}

/* ---------- início ---------- */
Store.subscribeAll();
if(window.claude&&claude.use){Store.init().then(render)} else Nostr.init();
Dados.init();
render();
if(window.__SITE__)setupPWA();
</script>

</body></html>
